name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: Checkin.Flutter
        run: flutter pub get

      - name: Analyze
        working-directory: Checkin.Flutter
        run: flutter analyze

      - name: Test
        working-directory: Checkin.Flutter
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: Checkin.Flutter
        run: flutter pub get

      - name: Build APK
        working-directory: Checkin.Flutter
        run: flutter build apk --release --dart-define=FLAVOR=prod

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkin-android-apk
          path: Checkin.Flutter/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: Checkin.Flutter
        run: flutter pub get

      - name: Build iOS
        working-directory: Checkin.Flutter
        run: flutter build ios --release --no-codesign --dart-define=FLAVOR=prod

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: checkin-ios-build
          path: Checkin.Flutter/build/ios/iphoneos
          retention-days: 30
